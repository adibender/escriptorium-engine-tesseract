[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "escriptorium-engine-tesseract"
version = "0.1.0"
description = "Tesseract OCR/HTR engine for eScriptorium"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pytesseract>=0.3.10",
    "Pillow",
]

# This is the whole integration. Installing the package makes the engine appear in eScriptorium;
# there is no registration step and no eScriptorium file to edit.
[project.entry-points."escriptorium.engines"]
tesseract = "escriptorium_engine_tesseract:TesseractEngine"

[tool.setuptools]
packages = ["escriptorium_engine_tesseract"]
